name: verify

on:
  push:
    branches: [main]
  pull_request:

# This repo is public and holds no secrets, which is the point. Nothing here
# needs credentials, and the workflow is given none — read-only on contents so
# a compromised action in the dependency tree cannot push.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The secret scan asks git what it would publish, so it needs more
          # than the default shallow tip to be asking about anything real.
          fetch-depth: 0

      # THE VERSION IS NOT INCIDENTAL. FXServer runs Lua 5.4 and gate 1 is
      # `luac -p` on every file — so a 5.3 compiler here would pass syntax the
      # game rejects and, worse, reject syntax the game accepts. Ubuntu ships
      # the binaries suffixed; verify.sh looks for bare `luac` and `lua` on
      # PATH, so they are linked rather than the script being taught about
      # every distro's naming.
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          sudo ln -sf /usr/bin/luac5.4 /usr/local/bin/luac
          sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua

      # br_ddb runs under FXServer's Node 22 runtime. Building and testing it on
      # the same major version removes a compatibility gap between CI and the
      # box. setup-node caches both lockfiles but npm ci remains the authority.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            js-src/br_ddb/package-lock.json
            ui-src/package-lock.json

      - name: Install br_ddb dependencies
        working-directory: js-src/br_ddb
        run: npm ci

      # THREE DIFFERENT FAILURES, THREE CHECKS:
      #   lint   catches unbound identifiers that esbuild accepts as globals;
      #   test   drives the pure rules and the real event bridge;
      #   check  rebuilds in memory and compares the exact committed bundle.
      - name: Verify br_ddb source and committed bundle
        working-directory: js-src/br_ddb
        run: |
          npx eslint src scripts
          npm test
          npm run check

      - name: Install UI dependencies
        working-directory: ui-src
        run: npm ci

      # build:check saves the committed output, rebuilds with a fixed diagnostic
      # stamp, compares every emitted byte, and restores the checkout. This makes
      # TypeScript, CSS compatibility, UI rules, envelope tests and source/bundle
      # drift CI properties instead of relying only on the local hook.
      - name: Verify UI source and committed bundle
        working-directory: ui-src
        run: npm run build:check

      # ONE ENTRY POINT FOR THE TOOLCHAIN-FREE GATES. Everything Lua-specific —
      # syntax, unit suites, trust-boundary checks, manifests, secrets, deploy
      # fixtures and cross-language pins — remains the same command developers
      # run locally and the pre-commit hook invokes.
      - name: Run repository verification
        run: bash tools/verify.sh
