<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Control Tower (#396, owner, 2026-10-05, round 2): the app's icon on the
    desktop, the taskbar, the browser's tab and the top bar. An original
    drawing for this project, in the spirit of the owner's reference: a tall
    shaft, a wide glazed cab with mullions over a railed deck, antennas on the
    roof. A white tower on a blue tile, so it reads on the dark desktop and on
    the app's light and dark pages alike.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b8ef0"/>
      <stop offset="1" stop-color="#0757b8"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tile)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
  <g fill="#ffffff">
    <!-- the antennas -->
    <rect x="31" y="5" width="2" height="9"/>
    <rect x="24.5" y="8" width="1.8" height="6"/>
    <rect x="37.7" y="8" width="1.8" height="6"/>
    <!-- the roof -->
    <path d="M21 14h22l1.5 3h-25z"/>
    <!-- the cab, flaring outward to the roof -->
    <path d="M18 17h28l-3 11H21z"/>
    <!-- the railed deck under it -->
    <rect x="14" y="28.5" width="36" height="1.6" rx="0.6"/>
    <!-- the railing's posts -->
    <rect x="17" y="30.1" width="1.2" height="0.9"/>
    <rect x="22.4" y="30.1" width="1.2" height="0.9"/>
    <rect x="27.8" y="30.1" width="1.2" height="0.9"/>
    <rect x="35" y="30.1" width="1.2" height="0.9"/>
    <rect x="40.4" y="30.1" width="1.2" height="0.9"/>
    <rect x="45.8" y="30.1" width="1.2" height="0.9"/>
    <path d="M15 31h34v3H15z"/>
    <!-- the collar -->
    <path d="M18.5 34h27l-4 4h-19z"/>
    <!-- the shaft, tall, a little wider at its foot -->
    <path d="M25.5 38h13l0.7 17.5h-14.4z"/>
    <!-- the base -->
    <rect x="19" y="55" width="26" height="3.5" rx="1.2"/>
  </g>
  <g fill="#0b63c6">
    <!-- the cab's glass, four panes between the mullions -->
    <path d="M20.6 19.2h5.2l-0.5 6.6h-2.9z"/>
    <path d="M27.6 19.2h3.6v6.6h-3.9z"/>
    <path d="M32.8 19.2h3.6l0.3 6.6h-3.9z"/>
    <path d="M38.2 19.2h5.2l-1.8 6.6h-2.9z"/>
    <!-- the shaft's two grooves -->
    <path d="M29.4 39.5h1.2l0.1 14.5h-1.4z"/>
    <path d="M33.4 39.5h1.2l0.1 14.5h-1.4z"/>
  </g>
</svg>
