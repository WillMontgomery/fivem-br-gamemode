  /* The same visual language as the lobby (ui-src/src/index.css): solid
     black base, the royale purple (#22d3ee) as the only voice. CEF here is
     Chrome 103 -- plain CSS only, nothing exotic. Deliberately NOT a menu:
     an earlier draft mocked up the lobby card, and a menu that ignores
     clicks is worse than no menu (user call, 2026-08-04). */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #06080e;
    font-family: 'Barlow', 'Segoe UI', system-ui, sans-serif;
    color: #fff;
    overflow: hidden;
  }

  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 42%,
      rgba(14, 86, 110, 0.55), rgba(8, 18, 32, 0.75) 45%, rgba(6, 8, 14, 1) 78%);
    animation: breathe 5s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.85; }
    50%      { opacity: 1.0; }
  }

  .wrap {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 1.2vh;
    transition: opacity 400ms ease-out;
  }
  /* The exit, on br_core's cue: the CONTENT fades, the purple stays. The
     lobby behind this screen opens on the identical purple backdrop, so
     the shutdown that follows is pixel-invisible -- the player sees text
     leave, then the menu and the world arrive together. */
  .wrap.fading { opacity: 0; }

  h1 {
    font-family: 'Anton', 'Segoe UI', sans-serif;
    font-size: 8vh;
    font-weight: 400;
    letter-spacing: 0.01em;
    text-transform: uppercase;
  }
  h1 span { color: #22d3ee; }

  .tag {
    font-size: 2.1vh;
    color: rgba(255, 255, 255, 0.45);
  }

  /* The status stack: the loading circle ABOVE the gag line, both centred.
     Side by side, every new line's width nudged the circle horizontally --
     a spinner that jumps sideways every three seconds reads as a glitch.
     Stacked, the circle never moves and the text changes under it. The
     circle is the ONLY progress indicator -- a bar next to a spinner was
     two voices saying "working on it" (user calls, 2026-08-04). */
  .status {
    display: flex; flex-direction: column;
    align-items: center; gap: 1.6vh;
    margin-top: 4vh;
  }

  /* Fixed height so the fly-up cannot reflow the circle above it. */
  .line-slot { height: 2.6vh; }

  .spinner {
    width: 4.8vh; height: 4.8vh;
    border-radius: 50%;
    border: 0.55vh solid rgba(34, 211, 238, 0.22);
    border-top-color: #22d3ee;
    animation: spin 900ms linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* THE SAME FLY-UP AS THE VERDICT SCREEN'S SUPPORTING LINES -- endFlyUp in
     ui-src/src/index.css, identical offset and curve, shortened to fit a
     3-second cadence. Re-applied per message via the class-toggle reflow
     trick below. */
  .line {
    font-size: 2.0vh;
    color: rgba(255, 255, 255, 0.55);
  }
  .line.fly {
    animation: flyUp 700ms cubic-bezier(0.2, 0.9, 0.3, 1) both;
  }
  @keyframes flyUp {
    from { opacity: 0; transform: translateY(34px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <h1>FiveM <span>Royale</span></h1>
    <div class="tag">Drop in. Loot up. Outlast the storm.</div>
    <div class="status">
      <div class="spinner"></div>
      <div class="line-slot"><div class="line" id="line"></div></div>
    </div>
  </div>

<script>
  // The gag reel. One line at a time, random order without immediate
  // repeats, a fresh fly-up every three seconds.
  var LINES = [
    'Brewing the pilot’s coffee',
    'Hunting snakes in Sandy Shores',
    'Inflating the Battle Bus',
    'Folding forty-eight gliders',
    'Painting the storm purple',
    'Hiding the good loot',
    'Drawing circles on the map',
    'Untangling parachute cords',
    'Bribing the weatherman',
    'Sweeping the Cayo Perico runway',
    'Telling the cops to stay home',
    'Stocking shield potions',
    'Rehearsing the doors-open announcement',
    'Convincing the storm to play fair',
    'Counting to forty-eight',
    'Evacuating the civilians',
    'Testing gravity (still works)',
    'Arguing with the bus pilot',
    'Tightening the Titan’s screws',
    'Reading the storm’s terms and conditions',
    'Checking under the map for stragglers',
    'Warming up the Victory Royale',
    'Feeding the seagulls at Vespucci',
    'Mopping the vista point',
    'Teaching NPCs to duck'
  ];

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  var deck = shuffle(LINES.slice());
  var idx = 0;
  var el = document.getElementById('line');

  function next() {
    if (idx >= deck.length) {
      var last = deck[deck.length - 1];
      deck = shuffle(LINES.slice());
      // No immediate repeat across the reshuffle boundary.
      if (deck[0] === last) { deck.push(deck.shift()); }
      idx = 0;
    }
    el.textContent = deck[idx++] + '…';
    // Class-toggle reflow: drop the animation class, force a layout, put it
    // back -- the browser restarts the fly-up from frame zero.
    el.classList.remove('fly');
    void el.offsetWidth;
    el.classList.add('fly');
  }

  next();
  setInterval(next, 3000);

  // br_core cues the exit with SendLoadingScreenMessage just before the
  // manual shutdown: text out, glow stays.
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.eventName === 'br:fadeText') {
      document.querySelector('.wrap').classList.add('fading');
    }
  });
</script>
</body>
</html>
