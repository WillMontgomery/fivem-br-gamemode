  /* ------------------------------------------------------------------------
     THEME: BROADCAST (#423, owner's pick 2026-10-31). The wait as a live
     esports feed: the stills cut on a stinger, the name sits in a lower
     third, the gag line runs in the strap under it, and the indicator is a
     radar at the head of that strap.

     ONE SLANT, 15 DEGREES, FOR EVERY SHAPE: the stinger, the plates, the
     spine and the hint tag. A broadcast package reads as one system because
     its edges agree; mixed angles read as clip art.

     THE SAME DESIGN SYSTEM AS THE GAME, WRITTEN OUT BY HAND. This document
     has no bundler, no Tailwind and no ui-src/src/index.css, so every token
     below is a copy: cyan #22d3ee is the brand, white at any alpha, near-black
     blues. Gold is victory and magenta is the storm; neither appears here.

     CEF is Chrome 103 today and 144 is rolling out (#413), so both must work:
     hex and rgba only, no :has(), no individual transform properties. An
     unparseable color is not a fallback -- the declaration is dropped and
     the element renders with no color at all. Sizes are vh, so 720p to 4K
     scale together.

     DELIBERATELY NOT A MENU: a menu that ignores clicks is worse than no menu
     (owner, 2026-08-04). The loadscreen NUI is one-way -- it cannot fetch
     callbacks -- so nothing here may look clickable. The hint shows a KEY.
  ------------------------------------------------------------------------ */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #06080e;
    font-family: 'Barlow', 'Segoe UI', system-ui, sans-serif;
    color: #fff;
    overflow: hidden;
  }

  /* THE BASE GLOW, unchanged from the screen before this one. The lobby
     opens on this same glow, so it never fades; everything else sits above
     it, and with no stills it is the whole backdrop. */
  .wash {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 120% 90% at 50% 34%,
      rgba(14, 86, 110, 0.55), rgba(8, 18, 32, 0.72) 46%, rgba(6, 8, 14, 1) 80%);
  }
  .drift {
    position: absolute; inset: -20%;
    background: radial-gradient(ellipse 40% 35% at 30% 40%,
      rgba(34, 211, 238, 0.16), rgba(34, 211, 238, 0) 70%);
    animation: drift 14s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translate3d(-4%, -2%, 0) scale(1); }
    to   { transform: translate3d(6%, 3%, 0) scale(1.12); }
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 100% 100% at 50% 50%,
      rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, 0.62) 100%);
  }

  /* THE EXIT IS ONE FADE ON ONE CONTAINER. br_core shuts the screen down
     500ms after its cue (client/loading.lua); stills, effects, text,
     indicator and hint all live in .stage, so all of them are gone in 360ms
     and only the glow is left for the lobby's twin backdrop to take over. */
  .stage {
    position: absolute; inset: 0; z-index: 1;
    transition: opacity 360ms ease-out;
  }
  html.is-exiting .stage { opacity: 0; }

  /* THE STINGER: A CUT THAT NEVER SHOWS.
     Each slide is a window, slanted 15 degrees, that slides in from the left
     with the two cyan slabs riding its leading edge. The photo inside
     counter-slides by exactly as much, so it stands still while the window
     opens over it: the cut IS the slab's edge, on every frame, and the shot
     underneath has changed once the slab has passed. All transform, so the
     compositor does the work.

     The window overhangs the screen (16vh left, 50vh right) so its slanted
     sides clear the corners and the slabs park off-screen. Its travel is its
     own width, 100vw + 66vh: vw because it has to cross the real screen,
     ultrawide included. Once the slabs are off-screen the slant relaxes to
     zero, so a resting slide is a plain rectangle and its clip costs
     nothing. */
  #slides { position: absolute; inset: 0; z-index: 1; overflow: hidden; }
  .slide {
    position: absolute; top: 0; bottom: 0; left: -16vh; right: -50vh;
    overflow: hidden;
    visibility: hidden;
  }
  .slide.is-active, .slide.is-leaving {
    visibility: visible;
    animation: bcWipe 800ms both;
  }
  .slide.is-active { z-index: 2; }
  .slide.is-leaving { z-index: 1; }
  @keyframes bcWipe {
    0%    { transform: translateX(calc(-100vw - 66vh)) skewX(-15deg);
            animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); }
    87.5% { transform: translateX(0) skewX(-15deg);
            animation-timing-function: linear; }
    100%  { transform: translateX(0) skewX(0deg); }
  }
  .slide-img {
    position: absolute; top: 0; bottom: 0; left: 16vh; right: 50vh;
    z-index: 1;
    background-size: 0 0;            /* the photo is drawn by ::before */
    background-repeat: no-repeat;
  }
  .slide.is-active .slide-img, .slide.is-leaving .slide-img {
    animation: bcHold 800ms both;
  }
  @keyframes bcHold {
    0%    { transform: translateX(calc(100vw + 66vh)) skewX(15deg);
            animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); }
    87.5% { transform: translateX(0) skewX(15deg);
            animation-timing-function: linear; }
    100%  { transform: translateX(0) skewX(0deg); }
  }

  /* THE PUSH-IN HAS ITS OWN LAYER, so it never fights the wipe for one
     transform. It inherits the photo set on .slide-img. Long and linear, so
     the speed is the same however long a shot stays up. */
  .slide-img::before {
    content: ''; position: absolute; inset: 0;
    background-image: inherit;
    background-size: cover; background-position: center;
  }
  .slide.is-active .slide-img::before, .slide.is-leaving .slide-img::before {
    animation: bcPush 12s linear both;
  }
  @keyframes bcPush {
    from { transform: scale(1); }
    to   { transform: scale(1.12); }
  }
  .slide[data-kb="0"] .slide-img::before { transform-origin: 34% 42%; }
  .slide[data-kb="1"] .slide-img::before { transform-origin: 66% 36%; }
  .slide[data-kb="2"] .slide-img::before { transform-origin: 54% 64%; }
  .slide[data-kb="3"] .slide-img::before { transform-origin: 42% 30%; }

  /* The slabs: the wide one carries the cut, the thin one trails it. */
  .slide::before, .slide::after {
    content: ''; position: absolute; top: 0; bottom: 0; z-index: 2;
  }
  .slide::after {
    right: 0; width: 22vh;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0) 70%,
      rgba(255, 255, 255, 0.6)), #22d3ee;
  }
  .slide::before {
    right: 26vh; width: 4.5vh;
    background: #22d3ee;
  }

  /* OVER THE PHOTOS, UNDER THE TEXT: a slow light sweep, then scanlines and
     the scrim in one static layer. Texture, not content: each is faint
     enough that a still frame barely shows it. No diagonal hatch over the
     photos (owner, 2026-11-08: "you can remove that"). */
  .sweep, .grade { position: absolute; }
  .sweep {
    top: 0; bottom: 0; left: 0; width: 80vh; z-index: 2;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0),
      rgba(255, 255, 255, 0.09) 50%, rgba(255, 255, 255, 0));
    transform: translateX(-100vh) skewX(-15deg);
    animation: bcSweep 13s cubic-bezier(0.45, 0, 0.55, 1) 2.5s infinite;
  }
  @keyframes bcSweep {
    0%        { transform: translateX(-100vh) skewX(-15deg); }
    46%, 100% { transform: translateX(calc(100vw + 20vh)) skewX(-15deg); }
  }
  /* THE SCRIM IS WHERE THE TEXT IS: dark under the lower third and along
     the foot of the frame, clear across the top and right, where the
     picture gets to be the picture. */
  .grade {
    top: 0; right: 0; bottom: 0; left: 0; z-index: 4;
    background:
      repeating-linear-gradient(180deg,
        rgba(5, 10, 16, 0.13) 0, rgba(5, 10, 16, 0) 0.18vh, rgba(5, 10, 16, 0) 0.37vh),
      linear-gradient(0deg, rgba(5, 10, 16, 0.74), rgba(5, 10, 16, 0.34) 24%,
        rgba(5, 10, 16, 0) 50%),
      linear-gradient(90deg, rgba(5, 10, 16, 0.5), rgba(5, 10, 16, 0.15) 36%,
        rgba(5, 10, 16, 0) 62%);
  }

  /* THE LOWER THIRD: name plate, then the strap with the indicator and the
     gag line, and a cyan spine down the left of both. Every slanted shape
     leans about the same line (the strap's foot), so their edges stay
     parallel; only the backgrounds lean, and the text steps in to follow
     them, upright and crisp. It builds on like a broadcast graphic: spine,
     plates, then text. */
  .lower {
    position: absolute; left: 8vh; bottom: 9vh; z-index: 5;
  }
  .lower::before {
    content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 1.1vh;
    background: #22d3ee;
    transform-origin: 0 100%;
    animation: bcRise 520ms cubic-bezier(0.22, 1, 0.36, 1) 60ms both;
  }
  @keyframes bcRise {
    from { transform: skewX(-15deg) scaleY(0); }
    to   { transform: skewX(-15deg) scaleY(1); }
  }
  .plate, .strap { position: relative; margin-left: 1.8vh; }
  /* The strap runs past the plate: it has to hold the longest gag line,
     and the step reads as layout rather than as two boxes that missed. */
  .plate { width: 50vh; height: 15.4vh; }
  .strap { width: 56vh; height: 4.6vh; margin-top: 0.6vh; }
  .plate::before, .strap::before {
    content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    animation: bcOpen 650ms cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .plate::before {
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0) 40%),
      linear-gradient(90deg, rgba(14, 48, 62, 0.9), rgba(6, 10, 16, 0.88) 60%);
    transform-origin: 0 calc(100% + 5.2vh);   /* the strap's foot */
    animation-delay: 200ms;
  }
  .strap::before {
    background: rgba(14, 48, 62, 0.94);
    transform-origin: 0 100%;
    animation-delay: 340ms;
  }
  @keyframes bcOpen {
    from { transform: skewX(-15deg) scaleX(0); }
    to   { transform: skewX(-15deg) scaleX(1); }
  }

  .mark, .tag, .strap-in { position: relative; white-space: nowrap; }
  .mark {
    font-family: 'Anton', 'Segoe UI', sans-serif;
    font-size: 8.4vh; font-weight: 400; line-height: 1;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    padding: 1.5vh 0 0 7.6vh;
    animation: bcSlideIn 700ms cubic-bezier(0.22, 1, 0.36, 1) 380ms both;
  }
  .mark em { font-style: normal; color: #22d3ee; }
  .tag {
    font-size: 2.2vh; letter-spacing: 0.02em;
    color: rgba(255, 255, 255, 0.74);
    padding: 0.8vh 0 0 5.5vh;
    animation: bcSlideIn 700ms cubic-bezier(0.22, 1, 0.36, 1) 500ms both;
  }
  @keyframes bcSlideIn {
    from { opacity: 0; transform: translateX(-2.4vh); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .strap-in {
    display: flex; align-items: center; height: 100%;
    padding-left: 3.6vh;
    animation: bcSlideIn 700ms cubic-bezier(0.22, 1, 0.36, 1) 600ms both;
  }

  /* THE INDICATOR: A RADAR AT THE HEAD OF THE STRAP (the Feed theme's,
     owner, 2026-10-31). A conic wedge sweeps once every 2.4s and three blips
     flare as the beam crosses them, then fade like phosphor. It sweeps and
     never fills, so it cannot be read as progress: one voice, and no bar
     beside it (owner, 2026-08-04). Each blip runs on the sweep's period
     with a delay of (angle / 360 - 1) x 2.4s, so the flare lands under the
     beam without a line of script.

     It sits inside the strap, not over it: the plate is only 0.6vh above,
     so a disc that overhung would graze it and break the foot line the
     hint shares. At 3.8vh it clears both edges by 0.4vh, and the weights
     are set for that size: the rim is as heavy as the keycap's border, the
     inner rings stay a pixel wide at 1080p, and nothing glows but the
     blips, because nothing else in the lower third glows. The disc is
     content, so it stays an upright circle while the strap leans behind
     it, and it builds on with the gag line. */
  .radar {
    position: relative; flex: none;
    width: 3.8vh; height: 3.8vh; border-radius: 50%;
    margin-right: 1.5vh;
    background: radial-gradient(circle, rgba(14, 48, 62, 0.6) 0%, rgba(5, 10, 16, 0.8) 70%);
  }
  .radar svg { position: absolute; top: 0; left: 0; display: block; }
  .r-edge  { fill: none; stroke: #22d3ee; stroke-width: 3.95; }
  .r-ring  { fill: none; stroke: rgba(255, 255, 255, 0.16); stroke-width: 2.4; }
  .r-cross { stroke: rgba(255, 255, 255, 0.12); stroke-width: 2; }
  .r-sweep {
    position: absolute; top: 3%; right: 3%; bottom: 3%; left: 3%;
    border-radius: 50%;
    background: conic-gradient(rgba(34, 211, 238, 0) 0deg, rgba(34, 211, 238, 0) 240deg,
      rgba(34, 211, 238, 0.68) 360deg);
    animation: bcRadar 2.4s linear infinite;
  }
  .r-sweep::after {
    content: ''; position: absolute; left: 50%; top: 0;
    width: 0.16vh; height: 50%; margin-left: -0.08vh;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(34, 211, 238, 0.7));
  }
  @keyframes bcRadar {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .blip {
    position: absolute;
    width: 0.44vh; height: 0.44vh; margin: -0.22vh 0 0 -0.22vh;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0.44vh 0.06vh rgba(34, 211, 238, 0.95);
    animation: bcBlip 2.4s linear infinite;
  }
  .b1 { left: 76%;   top: 35%;   animation-delay: -2s; }       /*  60deg, r 0.60 */
  .b2 { left: 43.5%; top: 67.9%; animation-delay: -1.0667s; }  /* 200deg, r 0.38 */
  .b3 { left: 20.5%; top: 29.3%; animation-delay: -0.3667s; }  /* 305deg, r 0.72 */
  @keyframes bcBlip {
    0%   { opacity: 1;    transform: scale(1.6); }
    8%   { opacity: 0.9;  transform: scale(1); }
    65%  { opacity: 0.16; transform: scale(0.8); }
    100% { opacity: 0.1;  transform: scale(0.8); }
  }

  /* THE GAG LINE ROLLS UP INTO THE STRAP like a ticker change: the old
     screen's fly-up offset and curve (endFlyUp in ui-src/src/index.css),
     clipped by the strap so it rises out of it. */
  .line-slot { height: 100%; overflow: hidden; display: flex; align-items: center; }
  .line {
    font-size: 2.05vh; letter-spacing: 0.02em;
    color: rgba(255, 255, 255, 0.9);
    white-space: nowrap;
  }
  .line.fly { animation: bcRoll 700ms cubic-bezier(0.2, 0.9, 0.3, 1) both; }
  @keyframes bcRoll {
    from { opacity: 0; transform: translateY(2.6vh); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* THE HINT: a tag in the lower right, on the same foot line as the strap.
     It waits below the bottom edge and flies up when the track starts. The
     level meter dances while the track plays and lies flat and gray when
     muted, and the cyan edge grays with it, so the state reads at a glance. */
  #audioHint {
    position: absolute; right: 9vh; bottom: 9vh; z-index: 6;
    height: 4.6vh;
    display: flex; align-items: center;
    padding: 0 3.4vh 0 2.8vh;
    font-size: 1.9vh; letter-spacing: 0.03em;
    transform: translateY(15vh);
    transition: transform 700ms cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  #audioHint.on { transform: translateY(0); }
  #audioHint::before, #audioHint::after {
    content: ''; position: absolute; top: 0; bottom: 0; z-index: -1;
    transform: skewX(-15deg);
  }
  #audioHint::before { left: 0; right: 0; background: rgba(14, 48, 62, 0.94); }
  #audioHint::after { right: 0; width: 0.9vh; background: #22d3ee; }
  #audioHint.is-muted::after { background: rgba(255, 255, 255, 0.32); }

  /* A keycap, flat and small: a key to press, not a button to click. */
  .key {
    display: flex; align-items: center; justify-content: center;
    min-width: 2.8vh; height: 2.8vh; padding: 0 0.7vh;
    border: 0.15vh solid rgba(255, 255, 255, 0.6);
    border-bottom-width: 0.35vh;
    border-radius: 0.45vh;
    font-family: 'Anton', 'Segoe UI', sans-serif; font-size: 1.6vh; line-height: 1;
    margin-right: 1.1vh;
  }
  #audioHint.bump .key { animation: bcPress 300ms cubic-bezier(0.2, 0.9, 0.3, 1); }
  @keyframes bcPress {
    0%   { transform: translateY(0) scale(1); }
    35%  { transform: translateY(0.3vh) scale(0.9); }
    100% { transform: translateY(0) scale(1); }
  }
  .label { color: rgba(255, 255, 255, 0.88); margin-right: 1.6vh; }
  .meter { display: flex; align-items: flex-end; height: 2.2vh; }
  .meter i {
    display: block; width: 0.45vh; height: 100%; margin-left: 0.3vh;
    background: #22d3ee;
    transform-origin: 50% 100%;
    animation: bcLevel 0.74s ease-in-out infinite alternate;
  }
  .meter i:nth-child(1) { margin-left: 0; }
  .meter i:nth-child(2) { animation-duration: 0.52s; animation-delay: -0.3s; }
  .meter i:nth-child(3) { animation-duration: 0.9s;  animation-delay: -0.6s; }
  .meter i:nth-child(4) { animation-duration: 0.62s; animation-delay: -0.2s; }
  @keyframes bcLevel {
    from { transform: scaleY(0.22); }
    to   { transform: scaleY(1); }
  }
  #audioHint.is-muted .meter i {
    animation: none;
    transform: scaleY(0.14);
    background: rgba(255, 255, 255, 0.45);
  }
</style>
</head>
<body>
  <div class="wash"></div>
  <div class="drift"></div>
  <div class="vignette"></div>

  <div class="stage">
    <div id="slides"></div>
    <div class="sweep"></div>
    <div class="grade"></div>

    <div class="lower">
      <div class="plate">
        <h1 class="mark">Blitz <em>Royale</em></h1>
        <div class="tag">Outrun the storm. Outgun the rest.</div>
      </div>
      <div class="strap">
        <div class="strap-in">
          <div class="radar" aria-hidden="true">
            <svg viewBox="0 0 100 100" width="100%" height="100%">
              <circle class="r-ring" cx="50" cy="50" r="31"></circle>
              <circle class="r-ring" cx="50" cy="50" r="15"></circle>
              <path class="r-cross" d="M50 4V96M4 50H96"></path>
              <circle class="r-edge" cx="50" cy="50" r="47.5"></circle>
            </svg>
            <div class="r-sweep"></div>
            <i class="blip b1"></i><i class="blip b2"></i><i class="blip b3"></i>
          </div>
          <div class="line-slot"><div class="line" id="line"></div></div>
        </div>
      </div>
    </div>

    <div id="audioHint">
      <span class="key">M</span>
      <span class="label" data-label data-on="Mute" data-off="Unmute"></span>
      <span class="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    </div>
  </div>

  <audio id="track" preload="auto"></audio>

<script>
  /* THE MOVING PARTS: the reel, the stills, the track and the exit (#423).
     Ported from the previews they were proven in; the markup and CSS above
     decide how each looks, and this only switches classes on them.

     CEF IS CHROME 103 TODAY (144 is rolling out, and both must work): plain
     ES5 style, no optional chaining, nothing a 103 parser would refuse. */
  (function () {
    var root = document.documentElement;

    // THE STILLS. tools/loadscreen_shots.py writes this list and the files it
    // names (resources/[fivem-royale]/br_loadscreen/shots/), so run it rather
    // than editing here. The first still is the one the reel opens on, and
    // an empty list is a screen on the glow alone.
    var SHOTS = [
      /* shots:begin */
        'shots/01.webp',
        'shots/02.webp',
        'shots/03.webp',
        'shots/04.webp',
      /* shots:end */
    ];

    var SLIDE_MS = 7000;
    // THE STINGER TAKES 800MS (700 of travel, 100 to settle), so the still it
    // covers only has to outlive that.
    var FADE_MS = 900;

    // THE OWNER'S TRACK (2026-10-30): 1:54.8 of Ogg Vorbis with its own fade
    // in and out mixed in, so this adds no fade-in and plays it ONCE --
    // looping would replay the fade-in in the middle of a long load. M fades
    // it out and back in over muteFadeMs rather than cutting it (owner,
    // 2026-10-31).
    var TRACK = { src: 'audio/loadingscreen.ogg', volume: 0.5, fadeInMs: 0, muteFadeMs: 600 };
    var MUTE_KEY = 'br.loadscreen.muted';

    var LINES = [
      'Brewing the pilot’s coffee',
      'Hunting snakes in Sandy Shores',
      'Inflating the Battle Bus',
      'Folding forty-eight gliders',
      'Charging the storm',
      'Hiding the good loot',
      'Drawing circles on the map',
      'Untangling parachute cords',
      'Bribing the weatherman',
      'Sweeping the Cayo Perico runway',
      'Telling the cops to stay home',
      'Stocking shield potions',
      'Rehearsing the doors-open announcement',
      'Convincing the storm to play fair',
      'Counting to forty-eight',
      'Evacuating the civilians',
      'Testing gravity (still works)',
      'Arguing with the bus pilot',
      'Tightening the Titan’s screws',
      'Reading the storm’s terms and conditions',
      'Checking under the map for stragglers',
      'Warming up the Victory Royale',
      'Feeding the seagulls at Vespucci',
      'Mopping the vista point',
      'Teaching NPCs to duck'
    ];

    function shuffle(a) {
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    function store(get, value) {
      try {
        if (get) return window.localStorage.getItem(MUTE_KEY);
        window.localStorage.setItem(MUTE_KEY, value);
      } catch (e) { /* storage can be off; the default is simply not muted */ }
      return null;
    }

    // ------------------------------------------------------------- the reel ---
    // One line at a time, random order without immediate repeats, a fresh
    // roll-up every three seconds.
    function startReel() {
      var el = document.getElementById('line');
      var deck = shuffle(LINES.slice());
      var idx = 0;
      function next() {
        if (idx >= deck.length) {
          var last = deck[deck.length - 1];
          deck = shuffle(LINES.slice());
          // No immediate repeat across the reshuffle boundary.
          if (deck[0] === last) { deck.push(deck.shift()); }
          idx = 0;
        }
        el.textContent = deck[idx++] + '…';
        // Class-toggle reflow: drop the animation class, force a layout, put
        // it back -- the browser restarts the roll-up from frame zero.
        el.classList.remove('fly');
        void el.offsetWidth;
        el.classList.add('fly');
      }
      next();
      return setInterval(next, 3000);
    }

    // ----------------------------------------------------------- the stills ---
    // EVERY STILL IS PRELOADED, AND ONE THAT FAILS IS SKIPPED. The first one
    // waits for its own file rather than wiping in a blank, and a missing file
    // drops out of the rotation instead of showing as a black hole every lap.
    //
    // THE OPENING STILL IS CHOSEN, NOT RACED. Whichever file happened to
    // arrive first would otherwise open the reel. It waits up to 1.5s for the
    // first still, then takes the first one after it that has loaded.
    //
    // AND NOTHING IS ASKED FOR UNTIL THE PAGE HAS LOADED. CEF 144 shows this
    // frame at its load event, and every image still arriving holds that
    // event back, so the stills are requested after it: the screen appears
    // on the glow and the lower third, and the first still wipes in over
    // them as soon as it is here. A still's background is set only once its
    // probe has the file, so the CSS asks the cache rather than the disk.
    function startSlides(urls) {
      var box = document.getElementById('slides');
      if (!urls.length) return null;
      var slides = [];
      var current = -1;
      var timer = null;
      var openTimer = null;
      var stopped = false;

      function settle() {
        if (current >= 0) return;
        for (var j = 0; j < slides.length; j++) {
          if (slides[j].ok === false) continue;
          if (slides[j].ok === true) { show(j); return; }
          break;   // the one it wants has not answered yet
        }
        if (!openTimer) {
          openTimer = setTimeout(function () {
            if (current >= 0) return;
            for (var k = 0; k < slides.length; k++) {
              if (slides[k].ok === true) { show(k); return; }
            }
            openTimer = null;
          }, 1500);
        }
      }

      urls.forEach(function (url) {
        var s = document.createElement('div');
        s.className = 'slide';
        var img = document.createElement('div');
        img.className = 'slide-img';
        s.appendChild(img);
        box.appendChild(s);
        slides.push({ el: s, img: img, url: url, ok: null });
      });

      function load() {
        if (stopped) return;
        slides.forEach(function (rec) {
          var probe = new Image();
          probe.onload = function () {
            rec.img.style.backgroundImage = 'url("' + rec.url + '")';
            rec.ok = true;
            settle();
          };
          probe.onerror = function () { rec.ok = false; settle(); };
          probe.src = rec.url;
        });
      }
      if (document.readyState === 'complete') load();
      else window.addEventListener('load', load);

      // data-kb (0-3) cycles per still so the push-in varies its origin. ONE
      // animation-name is kept across .is-active and .is-leaving: changing it
      // would restart the motion mid-wipe.
      function show(i) {
        if (root.classList.contains('is-exiting')) return;
        var prev = current >= 0 ? slides[current].el : null;
        var next = slides[i].el;
        if (prev === next) return;
        next.setAttribute('data-kb', String(i % 4));
        next.classList.remove('is-leaving');
        next.classList.add('is-active');
        if (prev) {
          prev.classList.remove('is-active');
          prev.classList.add('is-leaving');
          setTimeout(function () { prev.classList.remove('is-leaving'); }, FADE_MS);
        }
        current = i;
        clearTimeout(timer);
        timer = setTimeout(advance, SLIDE_MS);
      }

      function advance() {
        for (var step = 1; step <= slides.length; step++) {
          var j = (current + step) % slides.length;
          if (slides[j].ok === true) { show(j); return; }
        }
        timer = setTimeout(advance, SLIDE_MS);   // only one still works: hold it
      }

      return function stop() { stopped = true; clearTimeout(timer); clearTimeout(openTimer); };
    }

    // ------------------------------------------------------------ the track ---
    // THE HINT FOLLOWS THE SOUND, NOT THE PAGE. It flies up on the first
    // 'playing' event, so a track that cannot start never advertises a key
    // that does nothing. Where autoplay is refused (a desktop browser opening
    // this file; possibly a future CEF), the first key or click starts it,
    // and that press is not also read as a mute.
    function startAudio() {
      var hint = document.getElementById('audioHint');
      var label = hint.querySelector('[data-label]');
      var audio = document.getElementById('track');
      audio.loop = false;
      audio.volume = 0;

      // THE TRACK PLAYS FROM MEMORY, NOT FROM ITS URL (owner, 2026-11-08: no
      // sound in game, and no hint). FiveM opens this page at
      // nui://br_loadscreen/, and its file handler answers every request with
      // the whole file from byte 0: it has no Range support
      // (NUISchemeHandler.cpp). Chromium checks a partial response only for
      // HTTP; a non-HTTP source is trusted to honor ranges
      // (resource_multi_buffer_data_provider.cc). So when the demuxer jumps
      // ahead (Ogg reads its last page for the duration) it is handed the
      // file's first bytes as the end, and the track never plays. A blob
      // answers ranges itself, which is how br_ui's copy plays the same file
      // (audio/lobbyTrack.ts). Where fetch fails (a desktop browser opening
      // this page from disk), the plain URL is the fallback.
      var ready = false;
      function load(then) {
        function plain() { audio.src = TRACK.src; ready = true; then(); }
        if (typeof fetch !== 'function' || !window.URL || !URL.createObjectURL) { plain(); return; }
        fetch(TRACK.src).then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.blob();
        }).then(function (b) {
          audio.src = URL.createObjectURL(b);
          ready = true;
          then();
        }, plain);
      }
      audio.addEventListener('error', function () {
        var err = audio.error;
        try { console.warn('[br_loadscreen] the track cannot play: ' + (err ? err.code + ' ' + (err.message || '') : 'unknown')); } catch (e) {}
      });

      // MUTED IS WHAT THE PLAYER ASKED FOR, NOT HOW FAR THE FADE HAS GOT. M
      // flips this at once, and the hint, the stored choice and the handoff
      // all read it; the sound follows over muteFadeMs, and audio.muted itself
      // only goes true once the fade has reached silence.
      var wantMuted = store(true) === '1';
      audio.muted = wantMuted;

      var target = TRACK.volume;
      var started = false;
      var armed = false;
      var leaving = false;
      var rampTimer = null;

      // EVEN FADES FOR THE KEY, STRAIGHT ONES FOR THE EXIT. The ear hears
      // level, not amplitude, so a straight line in volume holds and then
      // drops off a cliff (and comes back in with a jump); squaring it spreads
      // the change evenly across the fade. The exit stays straight: there this
      // copy fades against the lobby's copy of the same moment, and two
      // in-phase copies sum flat only when both fades are straight.
      function ramp(to, ms, done, even) {
        clearInterval(rampTimer);
        if (!(ms > 0)) { audio.volume = Math.max(0, Math.min(1, to)); if (done) done(); return; }
        var from = audio.volume;
        var t0 = Date.now();
        rampTimer = setInterval(function () {
          var k = Math.min(1, (Date.now() - t0) / ms);
          var s = !even ? k : (to > from ? k * k : 1 - (1 - k) * (1 - k));
          audio.volume = Math.max(0, Math.min(1, from + (to - from) * s));
          if (k >= 1) { clearInterval(rampTimer); if (done) done(); }
        }, 16);
      }

      function paint() {
        hint.classList.toggle('is-muted', wantMuted);
        label.textContent = wantMuted
          ? (label.getAttribute('data-off') || '')
          : (label.getAttribute('data-on') || '');
      }

      // Nothing to play until the track is loaded: a key pressed before then
      // is left alone (the track starts on its own a moment later), rather
      // than arming a start that would swallow the player's first M.
      function tryPlay() {
        if (!ready || started) return;
        var p;
        try { p = audio.play(); } catch (e) { arm(); return; }
        if (p && typeof p.then === 'function') p.then(null, arm);
      }

      function arm() {
        if (armed) return;
        armed = true;
        var go = function (e) {
          document.removeEventListener('keydown', go, true);
          document.removeEventListener('mousedown', go, true);
          armed = false;
          if (started) return;   // it started meanwhile: this press is the player's own
          if (e) { e.brStartedTrack = true; }
          tryPlay();
        };
        document.addEventListener('keydown', go, true);
        document.addEventListener('mousedown', go, true);
      }

      audio.addEventListener('playing', function () {
        if (started) return;
        started = true;
        ramp(target, TRACK.fadeInMs);
        paint();
        hint.classList.add('on');
      });

      // A load longer than the track: once the song has ended there is
      // nothing left to mute, so the hint goes back down rather than offering
      // a key that does nothing.
      audio.addEventListener('ended', function () {
        hint.classList.remove('on');
      });

      // THE KEY FADES; IT DOES NOT CUT (owner, 2026-10-31). The press shows at
      // once, in the hint and the stored choice, and the sound follows it down
      // or back up over muteFadeMs; a press mid-fade turns the fade around
      // from wherever the level is. Once the exit has begun the key does
      // nothing: a new fade would cancel the exit's own and leave the track
      // playing. The loading screen always has keyboard focus, so this needs
      // no loadscreen_cursor.
      document.addEventListener('keydown', function (e) {
        if (e.repeat || e.brStartedTrack || leaving) return;
        var k = e.key || '';
        if (e.code !== 'KeyM' && k !== 'm' && k !== 'M') return;
        if (!started) { tryPlay(); return; }
        wantMuted = !wantMuted;
        store(false, wantMuted ? '1' : '0');
        paint();
        if (wantMuted) {
          ramp(0, TRACK.muteFadeMs, function () { audio.muted = true; }, true);
        } else {
          if (audio.muted) { audio.volume = 0; audio.muted = false; }
          ramp(target, TRACK.muteFadeMs, null, true);
        }
        hint.classList.remove('bump');
        void hint.offsetWidth;
        hint.classList.add('bump');
      });

      // THE HANDOFF: THE SONG CONTINUES IN THE LOBBY. This page cannot call
      // Lua (the loadscreen NUI has no callbacks), but it does not need to.
      // FiveM's root page (ext/ui-build/data/root.html) holds this screen as
      // the "loadingscreen" iframe right beside every resource's NUI frame,
      // br_ui's included, and a sibling can be posted to: parent.length and
      // parent[i] are on the cross-origin-allowed list. So on the exit cue the
      // exact position goes to every sibling with the moment it was read; the
      // lobby starts its own copy there, compensating for the time in flight,
      // and this copy fades as that one rises. Nothing listening means nothing
      // changes: this copy fades out exactly as before.
      //
      // ITS OWN KEY, NEVER t:'br'. br_ui's dispatcher treats t:'br' as a Lua
      // envelope, and a sibling's post reaches it. The lobby takes only the
      // numbers from this message, never a URL: any sibling can post one.
      //
      // AND IT CARRIES THE DEADLINE (owner, 2026-10-30: the song must not
      // play past the moment the ped stops walking and the Locker unlocks).
      // Only Lua knows when that is, and it says so in the exit cue itself,
      // as musicEndsInMs; this turns it into a time on the clock both pages
      // share.
      //
      // It sends the player's choice and the listening level, never a fade's
      // halfway point: an M pressed just before the cue still counts, and a
      // track coming back up rises all the way in the lobby.
      function handoff(endsInMs) {
        if (!started || audio.paused) return;
        var p = window.parent;
        if (!p || p === window) return;
        var now = Date.now();
        var msg = { brTrackHandoff: {
          v: 1,
          position: audio.currentTime,
          at: now,
          endsAt: (typeof endsInMs === 'number' && isFinite(endsInMs) && endsInMs >= 0) ? now + endsInMs : null,
          muted: wantMuted,
          volume: target
        } };
        var n = 0;
        try { n = p.length; } catch (e) { return; }
        for (var i = 0; i < n; i++) {
          var f = null;
          try { f = p[i]; } catch (e) { continue; }
          if (!f || f === window) continue;
          try { f.postMessage(msg, '*'); } catch (e) {}
        }
      }

      paint();
      load(tryPlay);
      return {
        handoff: handoff,
        fadeOut: function (ms) { leaving = true; ramp(0, ms, function () { audio.pause(); }); }
      };
    }

    // -------------------------------------------------------------- the exit ---
    // br_core sends br:fadeText and shuts the screen down 500ms later
    // (client/loading.lua). Everything above the base glow is gone inside
    // that, the track included, so the lobby's twin backdrop takes over
    // without a visible cut.
    var reel = startReel();
    var stopSlides = startSlides(SHOTS);
    var track = startAudio();
    window.addEventListener('message', function (e) {
      var d = e.data || {};
      if (d.eventName !== 'br:fadeText') return;
      if (root.classList.contains('is-exiting')) return;
      root.classList.add('is-exiting');
      if (stopSlides) stopSlides();
      clearInterval(reel);
      track.handoff(d.musicEndsInMs);
      track.fadeOut(350);
    });
  })();
</script>
</body>
</html>
