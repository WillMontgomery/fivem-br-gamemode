<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blitz Royale</title>
    <script type="module" crossorigin src="./assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>
  <body>
    <!--
      The root is transparent and non-interactive by default. Only a screen that
      has explicitly taken focus re-enables pointer events on its own container.
      This is what stops a mis-timed focus grab from eating the player's clicks.
    -->
    <div id="root"></div>
  </body>
</html>
