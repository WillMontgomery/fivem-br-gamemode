    <title>FiveM Royale</title>

  <body>
    <!--
      The root is transparent and non-interactive by default. Only a screen that
      has explicitly taken focus re-enables pointer events on its own container.
      This is what stops a mis-timed focus grab from eating the player's clicks.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
